<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mist Engine — Hero Sheet (background)</title>
</head>
<body>
<!--
  This page is loaded once per connected player, automatically, via the extension manifest's
  "background_url" — independent of the toolbar-click popover (index.html). Its only job is to
  open the roll-log corner panel (index.html?view=rolllog) as a small popover anchored to the
  bottom-right corner of the screen, so every player sees a persistent, shared dice-roll widget
  without having to click anything.
  Mechanism confirmed against the official Owlbear "Dice" extension's own source (background.ts +
  PopoverTrays.tsx): a background page calling OBR.popover.open() with hidePaper/disableClickAway
  is exactly how that extension shows its own always-on corner preview, and the same popover id
  can be resized live afterwards via OBR.popover.setWidth/setHeight — which is how the roll-log
  page itself (app.js's renderRollLogPanel/toggleRollLogExpanded) implements the collapse/expand
  toggle, from inside index.html?view=rolllog, not from here.
-->
<script type="module">
import OBR from "./obr-sdk.bundle.js";
// Must match ROLL_LOG_POPOVER_ID / ROLL_LOG_COLLAPSED_SIZE in app.js — kept as literals here
// (rather than imported) because this page never loads the rest of app.js, which assumes an
// #app element and a full character-sheet DOM that this tiny background page doesn't have.
const ROLL_LOG_POPOVER_ID = "com.mistengine.hero-sheet/roll-log-popover";
// Must match ROLL_LOG_COLLAPSED_SIZE in app.js: 40x40 visible pill (see the "less big, match
// Owlbear's own round buttons" pass) plus ROLL_LOG_RIGHT_CLEARANCE (28px) / ROLL_LOG_BOTTOM_
// CLEARANCE (56px) of extra box width/height — see the comment on those constants in app.js for
// why the clearance lives in the box size and body.roll-log-view's own CSS padding, rather than
// here as a popover-level margin (a uniform OBR.popover.open() marginThreshold, tried first,
// moves both edges together and can't be tuned per axis).
const COLLAPSED_WIDTH = 40 + 28;
const COLLAPSED_HEIGHT = 40 + 56;
// Must match ROLL_LOG_PANEL_HIDDEN_KEY in app.js. The topbar's show/hide toggle (see
// setRollLogPanelHidden in app.js) opens/closes the live popover itself directly — it doesn't
// need this page's help for that, since any page belonging to this extension can control a
// popover it already knows the id of (already proven by the roll-log panel itself, which resizes
// this same popover from its own page via setWidth/setHeight). This page's only remaining job is
// to respect that same preference on ITS OWN boot, once per connected player, so a player who hid
// the widget doesn't have it silently reappear the next time they reconnect.
const ROLL_LOG_PANEL_HIDDEN_KEY = "mist-hero-sheet-roll-log-hidden";
OBR.onReady(() => {
  if (localStorage.getItem(ROLL_LOG_PANEL_HIDDEN_KEY) === "1") return;
  // Build an already-absolute URL ourselves: Owlbear's SDK resolves a relative "url" by
  // concatenating its own origin with the string with NO separator inserted, which breaks on any
  // site not hosted at the domain root (e.g. a GitHub Pages project repo). Passing a full
  // "https://…" URL sidesteps that entirely — same fix as openExpandedView() in app.js.
  const url = window.location.origin + window.location.pathname.replace(/background\.html$/, "index.html") + "?view=rolllog";
  OBR.popover.open({
    id: ROLL_LOG_POPOVER_ID,
    url,
    width: COLLAPSED_WIDTH,
    height: COLLAPSED_HEIGHT,
    anchorOrigin: { horizontal: "RIGHT", vertical: "BOTTOM" },
    transformOrigin: { horizontal: "RIGHT", vertical: "BOTTOM" },
    disableClickAway: true,
    hidePaper: true,
    marginThreshold: 0,
  });
});
</script>
</body>
</html>
